name: build-test_6.1_kpm

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU 分支'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启 susfs'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '是否开启 KPM'
        required: true
        type: boolean
        default: true
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: 'BBR 算法模式'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: 'Droidspaces 容器支持模式'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置'
        required: true
        type: boolean
        default: false
      ssg_enable:
        description: '是否启用三星 SSG IO 调度器'
        required: true
        type: boolean
        default: false
      rekernel_enable:
        description: '是否启用 Re-Kernel 支持'
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: '是否开启内核级基带保护'
        required: true
        type: boolean
        default: false
      ccache_update:
        description: '是否更新 ccache 缓存'
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: '是否上传 ccache 调试日志'
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: '内核后缀，留空使用默认值'
        required: false
        type: string
        default: 'AoGou'

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  build_57:
    name: 构建 6.1.57
    uses: ./.github/workflows/fastbuild_6.1.57.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      ssg_enable: ${{ inputs.ssg_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      batch_mode: true
  build_75:
    name: 构建 6.1.75
    uses: ./.github/workflows/fastbuild_6.1.75.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      ssg_enable: ${{ inputs.ssg_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      batch_mode: true
  build_115:
    name: 构建 6.1.115
    uses: ./.github/workflows/fastbuild_6.1.115.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      ssg_enable: ${{ inputs.ssg_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      batch_mode: true
  build_118:
    name: 构建 6.1.118
    uses: ./.github/workflows/fastbuild_6.1.118.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      ssg_enable: ${{ inputs.ssg_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      batch_mode: true
  build_128:
    name: 构建 6.1.128
    uses: ./.github/workflows/fastbuild_6.1.128.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      ssg_enable: ${{ inputs.ssg_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      batch_mode: true
  build_134:
    name: 构建 6.1.134
    uses: ./.github/workflows/fastbuild_6.1.134.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      ssg_enable: ${{ inputs.ssg_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      batch_mode: true
  build_141:
    name: 构建 6.1.141
    uses: ./.github/workflows/fastbuild_6.1.141.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      ssg_enable: ${{ inputs.ssg_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
      batch_mode: true
  release:
    name: 汇总七个版本并发布
    if: ${{ needs.build_57.result == 'success' && needs.build_75.result == 'success' && needs.build_115.result == 'success' && needs.build_118.result == 'success' && needs.build_128.result == 'success' && needs.build_134.result == 'success' && needs.build_141.result == 'success' }}
    needs:
      - build_57
      - build_75
      - build_115
      - build_128
      - build_134
      - build_141
      - build_118
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下载七个 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          pattern: AnyKernel3_*.zip
          path: ./release_zips
          merge-multiple: true
          skip-decompress: true
      - name: 校验七个 ZIP 工件
        shell: bash
        run: |
          shopt -s nullglob
          zips=(release_zips/AnyKernel3_*.zip)
          if [[ "${#zips[@]}" -ne 7 ]]; then
            echo "期望 7 个 ZIP，实际找到 ${#zips[@]} 个" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          printf '已找到：%s\n' "${zips[@]}"
      - name: 创建统一 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSU_TYPE: ${{ inputs.ksu_type }}
          KSUVER: ${{ needs.build_57.outputs.ksuver }}
          SUSFS_ENABLE: ${{ inputs.susfs_enable }}
          KPM_ENABLE: ${{ inputs.kpm_enable }}
          LZ4_ENABLE: ${{ inputs.lz4_enable }}
          LZ4KD_ENABLE: ${{ inputs.lz4kd_enable }}
          BBR_ENABLE: ${{ inputs.bbr_enable }}
          DROIDSPACES_ENABLE: ${{ inputs.droidspaces_enable }}
          BETTER_NET: ${{ inputs.better_net }}
          SSG_ENABLE: ${{ inputs.ssg_enable }}
          REKERNEL_ENABLE: ${{ inputs.rekernel_enable }}
          BASEBAND_GUARD: ${{ inputs.baseband_guard }}
          CCACHE_UPDATE: ${{ inputs.ccache_update }}
          CCACHE_DEBUG: ${{ inputs.ccache_debug }}
          KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
        shell: bash
        run: |
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG="OPPO-OPlus-Realme-build-all-${TIME}-${GITHUB_RUN_ID}"
          case "$KSU_TYPE" in
            resukisu) KSU_TYPENAME="ReSukiSU" ;;
            sukisu) KSU_TYPENAME="SukiSU Ultra" ;;
            ksunext) KSU_TYPENAME="KernelSU Next" ;;
            ksu) KSU_TYPENAME="KSU" ;;
            *) KSU_TYPENAME="无内置KSU" ;;
          esac
          cat > release_notes.md <<EOF
          ### 📱 欧加真 ${KSU_TYPENAME} SM8650 七版本通用内核 | 构建信息
          - 内核版本号：6.1.57、6.1.75、6.1.115、6.1.118、6.1.128、6.1.134、6.1.141
          - 编译时间：${TIME_FORM}
          - 机型：欧加真骁龙8Gen3通用 SM8650 七版本内核
          - KSU分支：${KSU_TYPENAME}
          - susfs支持：${SUSFS_ENABLE}
          - KPM支持：${KPM_ENABLE}
          - LZ4支持：${LZ4_ENABLE}
          - LZ4KD支持：${LZ4KD_ENABLE}
          - 网络功能增强：${BETTER_NET}
          - BBR/Brutal 等拥塞控制算法支持：${BBR_ENABLE}
          - Droidspaces 容器支持：${DROIDSPACES_ENABLE}
          - 三星SSG IO调度器支持：${SSG_ENABLE}
          - Re-Kernel支持：${REKERNEL_ENABLE}
          - 内核级基带保护支持：${BASEBAND_GUARD}
          - ccache 更新：${CCACHE_UPDATE}
          - ccache 调试日志：${CCACHE_DEBUG}
          - 内核后缀：${KERNEL_SUFFIX}

          ### 📦 各版本机型与源码对应关系
          | 内核版本 | 平台/机型 | Android | 源码分支 |
          | --- | --- | --- | --- |
          | 6.1.57 | SM8650 / 一加12（源码命名） | android14 | [sm8650_u_14.0.0_oneplus12](https://github.com/cctv18/android_kernel_common_oneplus_sm8650/tree/oneplus/sm8650_u_14.0.0_oneplus12) |
          | 6.1.75 | SM8650 / 一加12（源码命名） | android14 | [sm8650_v_15.0.0_oneplus12](https://github.com/cctv18/android_kernel_common_oneplus_sm8650/tree/oneplus/sm8650_v_15.0.0_oneplus12) |
          | 6.1.115 | MT6989 / Ace5-Race（源码命名） | android14 | [mt6989_v_15.0.2_ace5_race](https://github.com/cctv18/android_kernel_oneplus_mt6989/tree/oneplus/mt6989_v_15.0.2_ace5_race) |
          | 6.1.118 | SM8650 / 一加12（源码命名） | android14 | [sm8650_b_16.0.0_oneplus12](https://github.com/cctv18/android_kernel_common_oneplus_sm8650/tree/oneplus/sm8650_b_16.0.0_oneplus12) |
          | 6.1.128 | MT6897 / 一加 Pad（源码命名） | android14 | [mt6897_v_15.0.0_oneplus_pad](https://github.com/cctv18/android_kernel_oneplus_mt6897/tree/oneplus/mt6897_v_15.0.0_oneplus_pad) |
          | 6.1.134 | MT6989 / Ace5-Race（源码命名） | android14 | [mt6989_b_16.0.0_ace5_race](https://github.com/cctv18/android_kernel_oneplus_mt6989/tree/oneplus/mt6989_b_16.0.0_ace5_race) |
          | 6.1.141 | SM8650 / 一加12（源码命名） | android14 | [sm8650_b_16.0.0_oneplus12_6.1.141](https://github.com/cctv18/android_kernel_common_oneplus_sm8650/tree/oneplus/sm8650_b_16.0.0_oneplus12_6.1.141) |

          - ReSukiSU管理器下载：[ReSukiSU_CI](https://github.com/cctv18/ReSukiSU_CI/releases)
          - SukiSU Ultra管理器下载：[SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
          - KernelSU Next管理器下载：[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - KSU原版管理器下载：[KernelSU](https://github.com/tiann/KernelSU/releases)

          ### ⏫️ 更新内容：
          - 更新${KSU_TYPENAME}至最新版本（${KSUVER}）
          - (预留)

          ### 📋 安装方法 | Installation Guide
          1. 若你的手机已经安装了第三方Recovery（如TWRP)，可下载对应机型的AnyKernel刷机包后进入Recovery模式，通过Recovery刷入刷机包后重启设备；
          2. 若你的手机之前已有 root 权限，可在手机上安装[HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在HorizonKernelFlasher中刷入AnyKernel刷机包并重启；
          3. 若你之前已刷入SukiSU Ultra内核，且SukiSU Ultra管理器已更新至最新版本，可在SukiSU Ultra管理器中直接刷入AnyKernel刷机包并重启；
          4. 刷入无lz4kd补丁版的内核前若刷入过lz4kd补丁版的内核，为避免出错，请先关闭zram模块；
          5. 由于KernelSU上游更新了元模块功能，最新版KSU管理器（包括除KernelSU Next以外的各分支）需要配合元模块(metamodule)才能正常挂载模块。目前的元模块包括[meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs), [mountify](https://github.com/backslashxx/mountify), [meta magicmount](https://github.com/7a72/meta-magic_mount/), [meta magicmount rs](https://github.com/Tools-cx-app/meta-magic_mount/), [hybrid mount](https://github.com/YuzakiKokuban/meta-hybrid_mount)等。若你是第一次使用KSU或刚从旧版KSU管理器升级至新版，请先安装一个元模块，这样其他涉及系统挂载的模块才能正常运行；
          6. KernelPatch Next（即KPN）是一个独立于KSU的KPM实现，可以运行在任意KSU/面具环境中（不适用于Apatch），且不能与(Re)SukiSU内置的kpm功能共同使用，使用前请保证你的内核没有内置的kpm实现/修补。

          #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用[KernelFlasher](https://github.com/capntrips/KernelFlasher)等软件备份boot等关键启动分区!※※※
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "欧加真 SM8650 七版本内核 ${TIME_FORM}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip

